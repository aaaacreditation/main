<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AAA SME Business Readiness Check</title>
<meta name="description" content="Free check that scores your SME the way a lender or investor would, across six business-readiness areas." />
<meta name="theme-color" content="#173d73" />
<link rel="icon" type="image/png" href="/logo/AAA-Logo.png" />
<link rel="apple-touch-icon" href="/logo/AAA-Logo.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AAA Readiness" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#111A38;--blue:#2547C4;--mid:#3E6BE0;--accent:#5B8DEF;
  --ink:#141A2B;--slate:#4C566E;--muted:#8B94A9;--line:#E4E8F2;--line2:#EEF1F8;
  --paper:#FFFFFF;--wash:#F5F7FC;--light:#EAF0FE;
  --g-bg:#E7F7EF;--g-mid:#12A362;--g-dark:#0A6B40;--g-border:#A6DCC4;
  --a-bg:#FEF6E7;--a-mid:#C98A0A;--a-dark:#7A5200;--a-border:#F3CD73;
  --r-bg:#FDEFEF;--r-mid:#CE3B3B;--r-dark:#7A1818;--r-border:#F2ADAD;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-disp:'Space Grotesk',var(--font-sans);
  /* aliases so existing component CSS keeps working */
  --color-text-primary:var(--ink);--color-text-secondary:var(--slate);--color-text-tertiary:var(--muted);
  --color-border-secondary:var(--line);--color-border-tertiary:var(--line2);
  --color-background-primary:var(--paper);--color-background-secondary:var(--wash);
}
html,body{height:100%}
body{
  font-family:var(--font-sans);color:var(--ink);
  background:transparent;
  min-height:100%;display:flex;align-items:flex-start;justify-content:center;
  padding:0;-webkit-font-smoothing:antialiased;
}
.card{
  width:100%;max-width:1080px;background:var(--paper);
  border:1px solid var(--line);border-radius:18px;overflow:hidden;
}
.shell{display:flex;flex-direction:column;min-height:0}
.ti{line-height:1}
::selection{background:var(--light)}

/* ===== brand top bar ===== */
.topbar{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,#16214A,#111A38)}
.topbar-logo{height:46px;width:auto;max-width:72%;display:block}
.brand-mark{width:38px;height:38px;background:var(--navy);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand-mark span{color:#fff;font-family:var(--font-disp);font-size:12px;font-weight:600;letter-spacing:1px}
.brand-text strong{display:block;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25}
.brand-text small{font-size:10.5px;color:var(--muted);letter-spacing:.2px}
.topbar-tag{margin-left:auto;font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;letter-spacing:.3px;flex-shrink:0}

/* ===== WELCOME ===== */
.welcome{padding:1.75rem 1.5rem 1.5rem}
.wl-eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-disp);font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
.wl-eyebrow::before{content:"";width:16px;height:1.5px;background:var(--blue);display:inline-block}
.wl-h{font-family:var(--font-disp);font-size:27px;line-height:1.18;font-weight:600;letter-spacing:-.3px;color:var(--ink);margin-bottom:10px}
.wl-h em{font-style:normal;color:var(--blue)}
.wl-lead{font-size:13.5px;line-height:1.65;color:var(--slate);margin-bottom:1.35rem}

.gauge-hero{display:flex;justify-content:center;margin:.25rem 0 1.35rem}
.gauge-hero svg{width:200px;height:118px;overflow:visible}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:1.35rem}
.stat{background:var(--wash);border:1px solid var(--line2);border-radius:13px;padding:12px 10px;text-align:center}
.stat-n{font-family:var(--font-disp);font-size:19px;font-weight:600;color:var(--navy);letter-spacing:-.4px}
.stat-l{font-size:10px;color:var(--slate);line-height:1.35;margin-top:3px}

.areas-lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-bottom:9px}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:1.5rem}
.area{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px;color:var(--ink);font-weight:500}
.area i{font-size:16px;color:var(--mid);flex-shrink:0}

.btn-primary{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;background:var(--navy);color:#fff;border:none;border-radius:12px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;transition:transform .12s,box-shadow .18s,background .18s;box-shadow:0 8px 20px -8px rgba(37,71,196,.55)}
.btn-primary:hover{background:var(--blue);transform:translateY(-1px);box-shadow:0 12px 26px -8px rgba(37,71,196,.6)}
.btn-primary:active{transform:translateY(0)}
.wl-note{font-size:11px;color:var(--muted);text-align:center;margin-top:11px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.wl-note span{display:inline-flex;align-items:center;gap:4px}
.install-row{margin-top:14px;display:none}
.install-row.show{display:block}
.btn-install{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:12px;font-family:var(--font-sans);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.btn-install:hover{background:var(--wash);border-color:var(--mid)}
.install-hint{font-size:11.5px;color:var(--slate);line-height:1.5;background:var(--wash);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin-top:12px;display:none;align-items:flex-start;gap:7px}
.install-hint.show{display:flex}
.install-hint i{font-size:15px;color:var(--mid);flex-shrink:0;margin-top:1px}

/* ===== CAPTURE ===== */
.capture{padding:1.75rem 1.5rem 1.5rem}
.cap-eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-disp);font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.cap-eyebrow::before{content:"";width:16px;height:1.5px;background:var(--blue);display:inline-block}
.cap-h{font-family:var(--font-disp);font-size:22px;font-weight:600;letter-spacing:-.2px;color:var(--ink);line-height:1.25;margin-bottom:7px}
.cap-sub{font-size:13px;color:var(--slate);line-height:1.6;margin-bottom:1.4rem}
.field{margin-bottom:.95rem}
.field label{display:block;font-size:12px;font-weight:600;color:var(--slate);margin-bottom:6px}
.field .in-wrap{position:relative}
.field .in-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted);pointer-events:none;transition:color .15s}
.field input{width:100%;padding:12px 14px 12px 38px;font-size:14px;font-family:var(--font-sans);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:11px;transition:border-color .15s,box-shadow .15s;outline:none}
.field input::placeholder{color:var(--muted)}
.field input:focus{border-color:var(--mid);box-shadow:0 0 0 3px var(--light)}
.field input:focus + i,.field .in-wrap:focus-within i{color:var(--mid)}
.field input.err{border-color:var(--r-mid);box-shadow:0 0 0 3px var(--r-bg)}
.field-err{font-size:11px;color:var(--r-mid);margin-top:5px;display:none;align-items:center;gap:4px}
.field-err.show{display:flex}
.cap-privacy{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--slate);line-height:1.5;background:var(--wash);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;margin:.35rem 0 1.25rem}
.cap-privacy i{font-size:15px;color:var(--mid);margin-top:1px;flex-shrink:0}
.cap-back{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;margin-top:12px;width:100%;text-align:center}
.cap-back:hover{color:var(--slate)}

/* ===== PROGRESS ===== */
.prog-wrap{padding:1.15rem 1.5rem .25rem}
.prog-top{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sec-badge{width:34px;height:34px;border-radius:10px;background:var(--light);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.prog-meta{flex:1;min-width:0}
.prog-title{font-family:var(--font-disp);font-size:14px;font-weight:600;color:var(--ink);line-height:1.2}
.prog-step{font-size:11px;color:var(--muted);margin-top:1px}
.prog-track{height:6px;background:var(--line2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dots{display:flex;gap:5px;margin-top:9px}
.dot{flex:1;height:4px;border-radius:99px;background:var(--line2);transition:background .3s}
.dot.done{background:var(--mid)}
.dot.cur{background:var(--accent);opacity:.55}

/* ===== SCREEN / QUESTIONS ===== */
.screen{padding:1.35rem 1.5rem .5rem;flex:1}
.screen-sub{font-size:12.5px;color:var(--slate);line-height:1.6;margin-bottom:1.35rem;padding-bottom:1.1rem;border-bottom:1px dashed var(--line)}
.qblock{margin-bottom:1.35rem}
.q-text{font-size:14px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:5px}
.q-no{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:9px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--font-disp);font-size:11.5px;font-weight:600;line-height:1;vertical-align:2px}
.q-hint{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:11px}
.req-tag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;letter-spacing:.4px;color:#92400E;background:#FEF3C7;border-radius:5px;padding:3px 8px;margin-bottom:8px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:92px;padding:12px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;text-align:center;transition:all .14s;line-height:1.3}
.opt:hover{border-color:var(--mid);background:var(--light);transform:translateY(-1px)}
.opt.s-yes{background:var(--g-bg);border-color:var(--g-mid);color:var(--g-dark);font-weight:600;box-shadow:inset 0 0 0 1px var(--g-mid)}
.opt.s-partial{background:var(--a-bg);border-color:var(--a-mid);color:var(--a-dark);font-weight:600;box-shadow:inset 0 0 0 1px var(--a-mid)}
.opt.s-no{background:var(--r-bg);border-color:var(--r-mid);color:var(--r-dark);font-weight:600;box-shadow:inset 0 0 0 1px var(--r-mid)}

/* ===== NAV ===== */
.nav{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem;border-top:1px solid var(--line2);background:linear-gradient(0deg,#fff,#FBFCFF)}
.btn-back{padding:10px 18px;font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--slate);cursor:pointer;transition:background .15s}
.btn-back:hover:not(:disabled){background:var(--wash)}
.btn-back:disabled{opacity:.35;cursor:not-allowed}
.btn-cont{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;font-size:13.5px;font-weight:600;border:none;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer;transition:background .15s,transform .12s}
.btn-cont:hover:not(:disabled){background:var(--blue);transform:translateY(-1px)}
.btn-cont:disabled{opacity:.4;cursor:not-allowed}

/* ===== DISQ ===== */
.disq{padding:2rem 1.5rem;display:flex;flex-direction:column;align-items:center;text-align:center}
.disq-icon{width:62px;height:62px;border-radius:50%;background:var(--r-bg);display:flex;align-items:center;justify-content:center;margin-bottom:1.15rem;font-size:28px;color:var(--r-mid)}
.disq-h{font-family:var(--font-disp);font-size:20px;font-weight:600;color:var(--ink);margin-bottom:8px}
.disq-p{font-size:13px;color:var(--slate);line-height:1.65;max-width:400px;margin-bottom:1.4rem}
.disq-reason{width:100%;background:var(--r-bg);border:1px solid var(--r-border);border-radius:12px;padding:1rem 1.15rem;text-align:left;margin-bottom:1.1rem}
.disq-reason-title{font-size:10.5px;font-weight:600;color:var(--r-mid);margin-bottom:8px;letter-spacing:.4px}
.disq-reason-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink);padding:3px 0;line-height:1.5}
.disq-reason-row i{color:var(--r-mid);font-size:15px;margin-top:1px;flex-shrink:0}
.disq-next{width:100%;background:var(--wash);border:1px solid var(--line2);border-radius:12px;padding:1rem 1.15rem;text-align:left;margin-bottom:1.35rem}
.disq-next-title{font-size:10.5px;font-weight:600;color:var(--slate);margin-bottom:8px;letter-spacing:.4px}

/* ===== RESULT ===== */
.result{padding:1.35rem 1.5rem 1.5rem}
.result-hero{border-radius:16px;padding:1.35rem 1.4rem 1.2rem;margin-bottom:1.1rem;text-align:center;position:relative;overflow:hidden}
.rh-g{background:linear-gradient(180deg,#EBFAF2,#E7F7EF);border:1px solid var(--g-border)}
.rh-a{background:linear-gradient(180deg,#FFF9EC,#FEF6E7);border:1px solid var(--a-border)}
.rh-r{background:linear-gradient(180deg,#FEF2F2,#FDEFEF);border:1px solid var(--r-border)}
.r-icon{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:24px}
.ri-g{background:#C2EDD8;color:var(--g-dark)}
.ri-a{background:#FDEAB0;color:var(--a-dark)}
.ri-r{background:#F7BFBF;color:var(--r-dark)}
.r-status{font-family:var(--font-disp);font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.rs-g{color:var(--g-dark)}.rs-a{color:var(--a-dark)}.rs-r{color:var(--r-dark)}
.r-title{font-family:var(--font-disp);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:7px;line-height:1.3}
.r-msg{font-size:12.5px;color:var(--slate);line-height:1.65;max-width:400px;margin:0 auto}

/* signature: gauge + radar */
.viz{display:flex;gap:12px;margin-bottom:1.1rem;flex-wrap:wrap}
.viz-card{flex:1;min-width:170px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px 14px;display:flex;flex-direction:column;align-items:center}
.viz-title{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;align-self:flex-start}
.gauge-box{position:relative;width:168px;height:168px;display:flex;align-items:center;justify-content:center}
.gauge-box svg{transform:rotate(-90deg)}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge-num{font-family:var(--font-disp);font-size:38px;font-weight:700;letter-spacing:-1px;line-height:1}
.gauge-band{font-family:var(--font-disp);font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;margin-top:4px;padding:3px 9px;border-radius:99px}
.gb-g{color:var(--g-dark);background:var(--g-bg)}
.gb-a{color:var(--a-dark);background:var(--a-bg)}
.gb-r{color:var(--r-dark);background:var(--r-bg)}
.gn-g{color:var(--g-mid)}.gn-a{color:var(--a-mid)}.gn-r{color:var(--r-mid)}
#radarPoly{transition:opacity .7s ease .25s,transform .7s cubic-bezier(.34,1.3,.64,1) .25s;transform-origin:center;transform-box:fill-box}
.radar-cap{font-size:10.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.4}

/* category bars */
.cats{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px 6px;margin-bottom:1.1rem}
.cats-title{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.catrow{margin-bottom:12px}
.catrow-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.catrow-name{font-size:12.5px;font-weight:500;color:var(--ink)}
.catrow-pct{font-family:var(--font-disp);font-size:12.5px;font-weight:600}
.catbar-bg{height:7px;background:var(--line2);border-radius:99px;overflow:hidden}
.catbar-fill{height:100%;width:0;border-radius:99px;transition:width .9s cubic-bezier(.4,0,.2,1)}
.cf-g{background:linear-gradient(90deg,var(--g-mid),#3FCB8B)}
.cf-a{background:linear-gradient(90deg,var(--a-mid),#EBB43C)}
.cf-r{background:linear-gradient(90deg,var(--r-mid),#E86A6A)}

/* info cards (strengths/gaps) */
.icard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem 1.15rem;margin-bottom:10px}
.icard-title{font-size:12px;font-weight:600;color:var(--slate);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.icard-title i{font-size:16px}
.irow{display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px}
.irow:last-child{border-bottom:none}
.irow i{font-size:16px;flex-shrink:0;margin-top:1px}
.irow-main{color:var(--ink);font-weight:500}
.irow-sub{font-size:12px;color:var(--slate);margin-top:2px;line-height:1.5}
.pill{display:inline-block;font-size:11px;background:var(--light);color:var(--blue);border-radius:5px;padding:2px 8px;margin:4px 3px 0 0}

/* CTAs */
.cta-stack{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.cta{width:100%;padding:13px 16px;border-radius:12px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;text-decoration:none}
.cta-navy{background:var(--navy);color:#fff;box-shadow:0 8px 20px -8px rgba(37,71,196,.5)}
.cta-navy:hover{background:var(--blue);transform:translateY(-1px)}
.cta-amber{background:var(--a-dark);color:#fff}
.cta-amber:hover{background:#5a3a00;transform:translateY(-1px)}
.cta-ghost{background:#fff;color:var(--slate);border:1px solid var(--line)}
.cta-ghost:hover{background:var(--wash)}
.cta-disabled{background:var(--wash);color:var(--slate);border:1px solid var(--line);cursor:default}

.footer-note{font-size:11px;color:var(--muted);text-align:center;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:5px}
.restart-link{font-size:12px;color:var(--muted);text-align:center;cursor:pointer;margin-top:10px;background:none;border:none;display:block;width:100%;font-family:var(--font-sans)}
.restart-link:hover{color:var(--slate)}

@media (max-width:420px){
  .wl-h{font-size:24px}.stats{gap:7px}.stat-n{font-size:17px}
  .viz{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* ===== wide (horizontal) layout — the check is embedded in a page column,
   so each screen spreads across two columns instead of stacking tall ===== */
@media (min-width:900px){
  .welcome,.capture{
    display:grid;grid-template-columns:1fr 1fr;
    column-gap:44px;align-items:start;
    padding:1.9rem 2.2rem 1.8rem;
  }
  /* welcome: story on the left, what-you-get + CTA on the right */
  .welcome{align-items:center}
  .wl-col{min-width:0}
  .gauge-hero{margin-bottom:0}
  .wl-lead{margin-bottom:.9rem}
  .welcome .btn-primary{margin-top:.35rem}

  /* capture: intro across the top, then fields two-up */
  .cap-eyebrow,.cap-h,.cap-sub,.cap-privacy,.capture .btn-primary,.cap-back{grid-column:1/-1}
  .capture .field{grid-column:auto;margin-bottom:.5rem}
  .capture .field:first-of-type{grid-column:1/-1}

  /* questions: two per row, split by a rule down the middle.
     .screen-sub is child 1 and spans the row, so the left-hand question of
     each pair is an even child and carries the divider. */
  .screen{
    display:grid;grid-template-columns:1fr 1fr;
    column-gap:0;align-items:stretch;
    padding:1.35rem 2.2rem .75rem;
  }
  .screen-sub{grid-column:1/-1}
  .screen .qblock:nth-child(even){border-right:1px solid var(--line);padding-right:30px}
  .screen .qblock:nth-child(odd){padding-left:30px}
  .prog-wrap,.nav{padding-left:2.2rem;padding-right:2.2rem}

  /* result: score and profile side by side (already flex) */
  .result{padding-left:2.2rem;padding-right:2.2rem}
}

<script>
/* ---------------- config ---------------- */
const CONTACT={email:'info@aaa-accreditation.org',phone:'+15716012616',wa:'447727388234',collect:'aaa.accreditation4@gmail.com',
  /* Paste your Google Apps Script Web App URL here to save every submission as a row in your Google Sheet.
     Setup steps are in SETUP-GOOGLE-SHEET.txt. Leave blank to disable. */
  sheet:''};

const SECS=[
  {id:'verify',label:'Business Verification',icon:'ti-shield-check',pct:20},
  {id:'mgmt',label:'Management & Structure',icon:'ti-sitemap',pct:40},
  {id:'ops',label:'Operations',icon:'ti-settings-2',pct:60},
  {id:'biz',label:'Financial & Market',icon:'ti-report-money',pct:80},

];

const QS={
  verify:[
    {id:'v1',text:'Is your business legally registered?',hint:'E.g. business registration certificate, trade license, or tax registration.',req:true,disqNo:true,disqMsg:'Legal registration cannot be verified. This is a mandatory requirement for accreditation.',
      opts:[{v:'yes',l:'Yes'},{v:'no',l:'No'}]},
    {id:'v2',text:'Can you provide official registration or licensing documents?',hint:'These documents must be presented during the formal accreditation assessment.',req:true,disqNo:true,disqMsg:'Registration and licensing documents are mandatory evidence and must be available for accreditation to proceed.',
      opts:[{v:'yes',l:'Yes, I have them'},{v:'partial',l:'Some of them'},{v:'no',l:'Not at this time'}]},
    {id:'v3',text:'Is your business currently active and operational?',hint:'The business must be actively trading, delivering services, or fulfilling contracts.',req:true,disqNo:true,disqMsg:'Inactive businesses are ineligible for accreditation. The business must be actively operating.',
      opts:[{v:'yes',l:'Yes, active'},{v:'no',l:'No / dormant'}]},
    {id:'v4',text:'Are there any unresolved major legal or compliance violations affecting your business?',hint:'This includes regulatory investigations, court orders, or serious compliance breaches.',req:true,disqYes:true,disqMsg:'Major legal or compliance violations are an automatic disqualifying condition under AAA mandatory compliance rules.',
      opts:[{v:'no',l:'No'},{v:'yes',l:'Yes'}]}
  ],
  mgmt:[
    {id:'m1',text:'Does your business have a defined management structure?',hint:'E.g. an organizational chart, management structure document, or defined reporting lines.',req:true,
      opts:[{v:'yes',l:'Yes, documented'},{v:'partial',l:'Informal / verbal'},{v:'no',l:'Not yet defined'}]},
    {id:'m2',text:'Are ownership and key management responsibilities clearly identified?',hint:'Ownership records, role descriptions, or a management list.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Partially'},{v:'no',l:'Not yet'}]}
  ],
  ops:[
    {id:'o1',text:'Can you demonstrate active delivery of products or services?',hint:'E.g. contracts, invoices, delivery records, or a portfolio of completed work.',req:true,
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Limited evidence'},{v:'no',l:'Not yet'}]},
    {id:'o2',text:'Does your business maintain operational processes or procedures?',hint:'SOPs, workflow descriptions, or documented operational records.',
      opts:[{v:'yes',l:'Yes, documented'},{v:'partial',l:'Informal processes'},{v:'no',l:'No'}]},
    {id:'o3',text:'Do you have sufficient staff, tools, or resources to perform your work?',hint:'Staff list, equipment inventory, facilities info, or outsourcing agreements.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Partially'},{v:'no',l:'No'}]},
    {id:'o4',text:'Do you maintain communication channels with clients and stakeholders?',hint:'Website, social media, company profile, or formal communication records.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Some channels'},{v:'no',l:'No'}]}
  ],
  biz:[
    {id:'b1',text:'Do you maintain basic financial records and transaction evidence?',hint:'Bank statements, invoices, financial summaries, or accounting records.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Partially'},{v:'no',l:'No'}]},
    {id:'b2',text:'Are you aware of your business liabilities and financial obligations?',hint:'Tax records, liabilities list, or financial declarations.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Generally aware'},{v:'no',l:'No'}]},
    {id:'b3',text:'Have you defined your products or services and target market?',hint:'Company profile, brochures, service descriptions, or marketing materials.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Partially'},{v:'no',l:'No'}]},
    {id:'b4',text:'Can you demonstrate customer or market activity?',hint:'Customer references, testimonials, contracts, or sales records.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Some evidence'},{v:'no',l:'Not yet'}]}
  ],
  growth:[
    {id:'g1',text:'Do you have documented growth objectives or a business development plan?',hint:'Growth strategy, expansion plan, or investment proposal.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'In progress'},{v:'no',l:'No'}]},
    {id:'g2',text:'Do you collect or review feedback from customers or stakeholders?',hint:'Feedback forms, reviews, satisfaction surveys, or communication records.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Informally'},{v:'no',l:'No'}]},
    {id:'g3',text:'When operational issues arise, do you take steps to address them?',hint:'Corrective action records, issue logs, or improvement evidence.',
      opts:[{v:'yes',l:'Yes, consistently'},{v:'partial',l:'Sometimes'},{v:'no',l:'No'}]},
    {id:'g4',text:'Do you keep records of significant changes or improvements made to the business?',hint:'Improvement logs, updated procedures, or progress reports.',
      opts:[{v:'yes',l:'Yes'},{v:'partial',l:'Informally'},{v:'no',l:'No'}]}
  ]
};

/* six business-readiness areas for the radar + bars */
const CATS=[
  {k:'fin',   name:'Financial & Funding',    short:'Financial'},
  {k:'ops',   name:'Operations',             short:'Operations'},
  {k:'mgmt',  name:'Management & Structure',  short:'Management'},
  {k:'gov',   name:'Governance & Compliance', short:'Governance'},
  {k:'market',name:'Market Presence & Growth',short:'Market'},
  {k:'improve',name:'Continuous Improvement', short:'Improvement'}
];

let S={screen:'welcome',sec:0,ans:{},disqMsg:null,lead:{biz:'',name:'',email:''}};
let lastDetail={overall:0,cats:{}};

function sv(v){return v==='yes'?2:v==='partial'?1:0;}

function scoreDetail(){
  const a=S.ans;
  const groups={
    fin:[a.b1,a.b2],
    ops:[a.o1,a.o2,a.o3,a.o4],
    mgmt:[a.m1,a.m2],
    gov:[a.v4].map(v=>v==='no'?'yes':v==='yes'?'no':'partial'),
    market:[a.b3,a.b4,a.g1,a.g2],
    improve:[a.g3,a.g4]
  };
  const W={fin:.20,ops:.20,mgmt:.15,gov:.15,market:.15,improve:.15};
  const cats={};let tot=0;
  for(const k in W){
    const arr=groups[k].filter(x=>x!==undefined).map(sv);
    const pct=arr.length?Math.round((arr.reduce((a,b)=>a+b,0)/(arr.length*2))*100):0;
    cats[k]=pct;
    if(arr.length) tot+=(arr.reduce((a,b)=>a+b,0)/(arr.length*2))*W[k];
  }
  return {overall:Math.round(tot*100),cats};
}
function score(){return scoreDetail().overall;}

function mandatoryPass(){
  const a=S.ans;
  return(a.v1==='yes')&&(a.v2==='yes'||a.v2==='partial')&&(a.v3==='yes')&&(a.v4==='no')&&(a.m1==='yes'||a.m1==='partial')&&(a.o1==='yes'||a.o1==='partial');
}
function outcome(){
  const sc=score(), mp=mandatoryPass();
  if(!mp||sc<30) return 'not';
  if(sc>=50&&mp) return 'eligible';
  return 'partial';
}
function bandOf(p){return p>=67?'g':p>=34?'a':'r';}

function strengths(){
  const a=S.ans;const out=[];
  if(a.v1==='yes'&&a.v3==='yes') out.push({icon:'ti-building',t:'Legal registration & active status confirmed',s:'Your business is registered and operational, a core foundation for accreditation.'});
  if(a.m1==='yes') out.push({icon:'ti-sitemap',t:'Clear management structure',s:'A defined org structure demonstrates governance readiness.'});
  if(a.o1==='yes') out.push({icon:'ti-briefcase',t:'Active service delivery evidenced',s:'You can demonstrate active business operations.'});
  if(a.b1==='yes') out.push({icon:'ti-report-money',t:'Financial records maintained',s:'Proper financial records support business readiness.'});
  if(a.b4==='yes') out.push({icon:'ti-users',t:'Customer activity demonstrated',s:'Evidenced customer relationships strengthen your application.'});
  if(a.g3==='yes') out.push({icon:'ti-refresh',t:'Proactive issue resolution',s:'Addressing operational issues shows continuous improvement.'});
  return out.slice(0,4);
}
function gaps(){
  const a=S.ans;const out=[];
  if(a.m1!=='yes') out.push({icon:'ti-sitemap',t:'Management structure',s:'A documented org chart or management structure is required.',docs:['Organizational chart','Management structure document','Role descriptions']});
  if(a.o1!=='yes') out.push({icon:'ti-briefcase',t:'Active operations evidence',s:'Evidence of service or product delivery must be provided.',docs:['Contracts or invoices','Delivery records','Portfolio of work']});
  if(a.b1!=='yes') out.push({icon:'ti-report-money',t:'Financial records',s:'Basic financial records are expected for higher readiness levels.',docs:['Bank statements','Invoices or financial summaries','Accounting records']});
  if(a.o2!=='yes') out.push({icon:'ti-list-check',t:'Operational procedures',s:'Documented processes demonstrate operational maturity.',docs:['SOPs or workflow descriptions','Operational records']});
  if(a.b3!=='yes') out.push({icon:'ti-target',t:'Products & market definition',s:'Clearly defined offerings and target market strengthen credibility.',docs:['Company profile','Service brochures or marketing materials']});
  if(a.g1!=='yes') out.push({icon:'ti-trending-up',t:'Growth planning',s:'A growth or business development plan shows strategic direction.',docs:['Growth strategy document','Expansion or investment plan']});
  return out.slice(0,5);
}
function requiredDocs(){
  const a=S.ans;const docs=[];
  docs.push('Business registration certificate or trade license');
  if(a.m1!=='yes') docs.push('Organizational chart or management structure document');
  docs.push('Compliance declarations or regulatory records');
  docs.push('Contracts, invoices, or portfolio of work');
  if(a.b1!=='yes') docs.push('Financial records or bank statements');

}

/* ---------------- graphics ---------------- */
function heroGaugeSVG(){
  // decorative arc meter for welcome
  const cx=100,cy=100,r=80;
  function polar(ang){const a=(ang-180)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
  const seg=(a1,a2,col,w)=>{const[x1,y1]=polar(a1),[x2,y2]=polar(a2);const large=a2-a1>180?1:0;return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;};
  const[nx,ny]=polar(126); // needle at ~70%
  return `<svg viewBox="0 0 200 118" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${seg(0,60,'#F2ADAD',12)}${seg(62,120,'#F3CD73',12)}${seg(122,180,'#12A362',12)}
    <circle cx="${cx}" cy="${cy}" r="7" fill="#111A38"/>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#111A38" stroke-width="4" stroke-linecap="round"/>
    <text x="20" y="114" font-family="Space Grotesk" font-size="9" fill="#8B94A9">Low</text>
    <text x="150" y="114" font-family="Space Grotesk" font-size="9" fill="#8B94A9">Funding-ready</text>
  </svg>`;
}

function gaugeSVG(pct,band){
  const r=72,c=2*Math.PI*r,off=c*(1-pct/100);
  const col=band==='g'?'var(--g-mid)':band==='a'?'var(--a-mid)':'var(--r-mid)';
  return `<svg width="168" height="168" viewBox="0 0 168 168" xmlns="http://www.w3.org/2000/svg">
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--line2)" stroke-width="14"/>
    <circle id="gaugeRing" cx="84" cy="84" r="${r}" fill="none" stroke="${col}" stroke-width="14"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}"
      data-target="${off.toFixed(1)}" style="transition:stroke-dashoffset 1.1s cubic-bezier(.34,1.15,.64,1) .1s"/>
  </svg>`;
}

function radarSVG(cats){
  const cx=130,cy=118,R=78,n=CATS.length;
  const pt=(r,i)=>{const a=(i*(360/n)-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let g='';
  // rings
  [0.25,0.5,0.75,1].forEach(f=>{
    let pts='';for(let i=0;i<n;i++){const[x,y]=pt(R*f,i);pts+=`${x.toFixed(1)},${y.toFixed(1)} `;}
    g+=`<polygon points="${pts.trim()}" fill="none" stroke="var(--line2)" stroke-width="1"/>`;
  });
  // spokes + labels
  for(let i=0;i<n;i++){
    const[x,y]=pt(R,i);
    g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line2)" stroke-width="1"/>`;
    const[lx,ly]=pt(R+15,i);
    let anchor='middle';if(lx>cx+6)anchor='start';if(lx<cx-6)anchor='end';
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="${anchor}" font-family="Inter" font-size="9" font-weight="500" fill="var(--slate)">${CATS[i].short}</text>`;
  }
  // data polygon
  let dpts='';const dots=[];
  for(let i=0;i<n;i++){const v=(cats[CATS[i].k]||0)/100;const[x,y]=pt(R*Math.max(v,.02),i);dpts+=`${x.toFixed(1)},${y.toFixed(1)} `;dots.push([x,y]);}
  g+=`<polygon id="radarPoly" points="${dpts.trim()}" fill="rgba(62,107,224,.18)" stroke="var(--mid)" stroke-width="2" stroke-linejoin="round" style="opacity:0;transform:scale(.4)"/>`;
  dots.forEach(([x,y])=>{g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#fff" stroke="var(--mid)" stroke-width="2"/>`;});
  return `<svg width="260" height="236" viewBox="0 0 260 236" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}

/* ---------------- render ---------------- */
function render(){
  const app=document.getElementById('app');
  if(S.screen==='welcome'){app.innerHTML=rWelcome();return;}
  if(S.screen==='capture'){app.innerHTML=rCapture();return;}
  if(S.screen==='disq'){app.innerHTML=rDisq();lastDetail=scoreDetail();submitLead('Did not meet minimum requirements');return;}
  if(S.screen==='result'){app.innerHTML=rResult();submitLead(outcome()==='eligible'?'Funding-ready':outcome()==='partial'?'Developing':'Early stage');requestAnimationFrame(()=>requestAnimationFrame(animateResult));return;}
  const sec=SECS[S.sec], qs=QS[sec.id];
  const allAns=qs.every(q=>S.ans[q.id]!==undefined);
  let h=`<div class="prog-wrap">
    <div class="prog-top">
      <div class="sec-badge"><i class="ti ${sec.icon}" aria-hidden="true"></i></div>
      <div class="prog-meta"><div class="prog-title">${sec.label}</div><div class="prog-step">Step ${S.sec+1} of ${SECS.length}</div></div>
    </div>
    <div class="prog-track"><div class="prog-fill" style="width:${sec.pct}%"></div></div>
    <div class="dots">${SECS.map((_,i)=>`<div class="dot ${i<S.sec?'done':i===S.sec?'cur':''}"></div>`).join('')}</div>
  </div>
  <div class="screen">
    <div class="screen-sub">${secSub(sec.id)}</div>`;
  // questions are numbered continuously across every step, not per step
  const qOffset=SECS.slice(0,S.sec).reduce((n,s)=>n+((QS[s.id]||[]).length),0);
  qs.forEach((q,qi)=>{
    h+=`<div class="qblock">`;
    if(q.req) h+=`<div class="req-tag"><i class="ti ti-asterisk" style="font-size:9px" aria-hidden="true"></i>Required</div>`;
    h+=`<div class="q-text"><span class="q-no">${qOffset+qi+1}</span>${q.text}</div>`;
    if(q.hint) h+=`<div class="q-hint">${q.hint}</div>`;
    h+=`<div class="opts">`;
    q.opts.forEach(o=>{const cur=S.ans[q.id];h+=`<button class="opt${cur===o.v?' s-'+o.v:''}" onclick="pick('${q.id}','${o.v}')">${o.l}</button>`;});
    h+=`</div></div>`;
  });
  h+=`</div>
  <div class="nav">
    <button class="btn-back" onclick="goBack()" ${S.sec===0?'disabled':''}>← Back</button>
    <button class="btn-cont" onclick="goNext()" ${!allAns?'disabled':''}>${S.sec===SECS.length-1?'See my score':'Continue'} <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
  </div>`;
  app.innerHTML=h;
}

function secSub(id){
  return{verify:'A few baseline checks to confirm your business can proceed to assessment.',
    mgmt:'How your business is led and structured, a key signal for lenders and assessors.',
    ops:'Evidence that your business is actively delivering value to customers.',
    biz:'Your financial footing and market presence form the core of business readiness.',
    growth:'How your business learns, adapts and improves over time.'}[id]||'';
}

function pick(qid,val){
  const q=Object.values(QS).flat().find(x=>x.id===qid);
  S.ans[qid]=val;
  if(q&&q.disqNo&&val==='no'){S.disqMsg=q.disqMsg;S.screen='disq';render();return;}
  if(q&&q.disqYes&&val==='yes'){S.disqMsg=q.disqMsg;S.screen='disq';render();return;}
  render();
}
function goBack(){if(S.sec>0){S.sec--;render();}}
function goNext(){
  const qs=QS[SECS[S.sec].id];
  if(!qs.every(q=>S.ans[q.id]!==undefined))return;
  if(S.sec<SECS.length-1){S.sec++;render();}else{S.screen='result';render();}
}

function rWelcome(){
  return`<div class="welcome">
    <div class="wl-col">
    <div class="wl-eyebrow">Business readiness</div>
    <h1 class="wl-h">See how a lender <em>reads</em> your business in 2 minutes.</h1>
    <p class="wl-lead">A good business with informal records can still look risky on paper. This free check scores your business the way a lender or investor would, and shows you exactly where to strengthen.</p>
    <div class="gauge-hero">${heroGaugeSVG()}</div>
    </div>
    <div class="wl-col">
    <div class="stats">
      <div class="stat"><div class="stat-n">$5.7T</div><div class="stat-l">Global SME finance gap</div></div>
      <div class="stat"><div class="stat-n">40%+</div><div class="stat-l">SMEs underserved for credit</div></div>
      <div class="stat"><div class="stat-n">90%</div><div class="stat-l">Of businesses are SMEs</div></div>
    </div>
    <div class="areas-lbl">What we assess: 6 areas</div>
    <div class="areas">

    <button class="btn-primary" onclick="S.screen='capture';render()">Check my readiness <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
    <div class="wl-note"><span><i class="ti ti-clock" aria-hidden="true"></i>~2 minutes</span><span><i class="ti ti-lock" aria-hidden="true"></i>Confidential</span><span><i class="ti ti-bolt" aria-hidden="true"></i>Instant score</span></div>
    <div class="install-row" id="installRow"><button class="btn-install" onclick="doInstall()"><i class="ti ti-download" aria-hidden="true"></i>Add to home screen</button></div>
    <div class="install-hint" id="installHint"><i class="ti ti-device-mobile"></i><span>To install: tap the <b>Share</b> icon, then <b>Add to Home Screen</b>.</span></div>

  </div>`;
}

function rCapture(){
  const L=S.lead;
  return`<div class="capture">
    <div class="cap-eyebrow">Before we begin</div>
    <div class="cap-h">Let's set up your readiness report</div>
    <p class="cap-sub">Tell us who this is for. Your score and next steps are prepared against these details.</p>

function escAttr(s){return(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function capType(f,val){
  S.lead[f]=val;
  const el=document.getElementById('err-'+f),inp=document.getElementById('cap-'+f);
  if(el&&el.classList.contains('show')){el.classList.remove('show');if(inp)inp.classList.remove('err');}
}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e||'').trim());}
function capSubmit(){
  const L=S.lead;let ok=true;
  const set=(f,bad)=>{const el=document.getElementById('err-'+f),inp=document.getElementById('cap-'+f);if(bad){ok=false;if(el)el.classList.add('show');if(inp)inp.classList.add('err');}else{if(el)el.classList.remove('show');if(inp)inp.classList.remove('err');}};
  set('biz',!L.biz||!L.biz.trim());set('name',!L.name||!L.name.trim());set('email',!validEmail(L.email));
  if(!ok)return;
  L.biz=L.biz.trim();L.name=L.name.trim();L.email=L.email.trim();
  S.screen='quiz';render();
}

function rDisq(){
  return`<div class="disq">
    <div class="disq-icon"><i class="ti ti-alert-triangle" aria-hidden="true"></i></div>
    <div class="disq-h">Not ready just yet</div>
    <p class="disq-p">Based on your answers, your business doesn't currently meet the minimum requirements to proceed. Here's what to focus on first.</p>
    <div class="disq-reason">
      <div class="disq-reason-title">REQUIREMENT NOT MET</div>
      <div class="disq-reason-row"><i class="ti ti-circle-x" aria-hidden="true"></i><span>${S.disqMsg}</span></div>
    </div>
    <div class="disq-next">
      <div class="disq-next-title">SUGGESTED NEXT STEPS</div>
      <div class="disq-reason-row" style="padding:5px 0"><i class="ti ti-file-text" style="color:var(--mid);font-size:15px;margin-top:1px" aria-hidden="true"></i><span>Obtain official business registration and licensing documents</span></div>
      <div class="disq-reason-row" style="padding:5px 0"><i class="ti ti-briefcase" style="color:var(--mid);font-size:15px;margin-top:1px" aria-hidden="true"></i><span>Ensure the business is actively trading and operational</span></div>
      <div class="disq-reason-row" style="padding:5px 0"><i class="ti ti-gavel" style="color:var(--mid);font-size:15px;margin-top:1px" aria-hidden="true"></i><span>Resolve any outstanding legal or compliance matters</span></div>
    </div>
    <div style="width:100%">
      <a class="cta cta-navy" href="${mailUrl('not')}">Talk to us about getting ready <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
    </div>
    <button class="restart-link" onclick="restart()">← Start over</button>
    <div class="footer-note"><i class="ti ti-lock" style="font-size:11px" aria-hidden="true"></i>Your responses are confidential</div>
  </div>`;
}

function rResult(){
  const d=scoreDetail();lastDetail=d;
  const sc=d.overall, oc=outcome();
  const isElig=oc==='eligible',isPartial=oc==='partial';
  const col=isElig?'g':isPartial?'a':'r';
  const gband=bandOf(sc);
  const strs=strengths(),gps=gaps(),docs=requiredDocs();
  const bizName=(S.lead&&S.lead.biz)?S.lead.biz:'Your business';
  const status=isElig?'Business readiness: strong':isPartial?'Business readiness: developing':'Business readiness: early';
  const icon=isElig?'ti-circle-check':isPartial?'ti-alert-circle':'ti-info-circle';
  const heading=isElig?`${bizName} looks funding-ready`:isPartial?`${bizName} is on the right track`:`${bizName} needs some groundwork first`;
  const msg=isElig
    ?'Your business shows the signals lenders and accreditation assessors look for. You can proceed with accreditation and strengthen your funding conversations right away.'
    :isPartial
    ?'Your business shows real strengths, with a few areas to firm up before it reads as fully funding-ready. The breakdown below shows exactly where to focus.'
    :'Some foundations still need building before your business reads as funding-ready. The breakdown below shows where to start.';
  const bandLbl=gband==='g'?'Ready':gband==='a'?'Developing':'Early';

  let h=`<div class="result">
    <div class="result-hero rh-${col}">
      <div class="r-icon ri-${col}"><i class="ti ${icon}" aria-hidden="true"></i></div>
      <div class="r-status rs-${col}">${status}</div>
      <div class="r-title">${heading}</div>
      <p class="r-msg">${msg}</p>
    </div>

    <div class="viz">
      <div class="viz-card">
        <div class="viz-title">Overall score</div>
        <div class="gauge-box">
          ${gaugeSVG(sc,gband)}
          <div class="gauge-center">
            <div class="gauge-num gn-${gband}" id="gaugeNum" data-target="${sc}">0%</div>
            <div class="gauge-band gb-${gband}">${bandLbl}</div>
          </div>
        </div>
      </div>
      <div class="viz-card">
        <div class="viz-title">Six-area profile</div>
        ${radarSVG(d.cats)}
        <div class="radar-cap">How your business scores across the six areas lenders assess</div>
      </div>
    </div>

    <div class="cats">
      <div class="cats-title">Area breakdown</div>
      ${CATS.map(c=>{const p=d.cats[c.k]||0;const b=bandOf(p);return `<div class="catrow">
        <div class="catrow-top"><span class="catrow-name">${c.name}</span><span class="catrow-pct gn-${b}">${p}%</span></div>
        <div class="catbar-bg"><div class="catbar-fill cf-${b}" data-w="${p}%"></div></div>
      </div>`;}).join('')}
    </div>`;

  if(isElig&&strs.length){
    h+=`<div class="icard"><div class="icard-title"><i class="ti ti-star" style="color:var(--g-mid)" aria-hidden="true"></i>Key strengths identified</div>`;
    strs.forEach(s=>{h+=`<div class="irow"><i class="ti ${s.icon}" style="color:var(--g-mid)" aria-hidden="true"></i><div><div class="irow-main">${s.t}</div><div class="irow-sub">${s.s}</div></div></div>`;});
    h+=`</div><div class="icard"><div class="icard-title"><i class="ti ti-file-description" style="color:var(--mid)" aria-hidden="true"></i>Documents likely required</div>`;
    docs.forEach(dc=>{h+=`<div class="irow"><i class="ti ti-paperclip" style="color:var(--mid)" aria-hidden="true"></i><div class="irow-main">${dc}</div></div>`;});
    h+=`</div><div class="cta-stack">
      <a class="cta cta-navy" href="${mailUrl('eligible')}">Apply for accreditation <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
      <a class="cta cta-ghost" href="${waUrl('eligible')}" target="_blank" rel="noopener">Chat with us on WhatsApp</a>
    </div>`;
  }
  if(isPartial){
    h+=`<div class="icard"><div class="icard-title"><i class="ti ti-alert-circle" style="color:var(--a-mid)" aria-hidden="true"></i>Areas to strengthen</div>`;
    gps.slice(0,3).forEach(g=>{h+=`<div class="irow"><i class="ti ${g.icon}" style="color:var(--a-mid)" aria-hidden="true"></i><div><div class="irow-main">${g.t}</div><div class="irow-sub">${g.s}</div></div></div>`;});
    h+=`</div><div class="icard"><div class="icard-title"><i class="ti ti-file-x" style="color:var(--a-mid)" aria-hidden="true"></i>Documentation to prepare</div>`;
    gps.slice(0,4).forEach(g=>{h+=`<div class="irow"><i class="ti ti-paperclip" style="color:var(--muted)" aria-hidden="true"></i><div><div class="irow-main">${g.t}</div><div class="irow-sub">${g.docs.map(dd=>`<span class="pill">${dd}</span>`).join('')}</div></div></div>`;});
    h+=`</div><div class="cta-stack">
      <a class="cta cta-amber" href="${mailUrl('partial')}">Talk to an advisor <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
      <a class="cta cta-ghost" href="${waUrl('partial')}" target="_blank" rel="noopener">Chat with us on WhatsApp</a>
    </div>`;
  }
  if(!isElig&&!isPartial){
    h+=`<div class="icard"><div class="icard-title"><i class="ti ti-circle-x" style="color:var(--r-mid)" aria-hidden="true"></i>Foundations to build first</div>`;
    gps.slice(0,3).forEach(g=>{h+=`<div class="irow"><i class="ti ${g.icon}" style="color:var(--r-mid)" aria-hidden="true"></i><div><div class="irow-main">${g.t}</div><div class="irow-sub">${g.s}</div></div></div>`;});
    h+=`</div><div class="cta-stack">
      <a class="cta cta-navy" href="${mailUrl('not')}">Get a readiness plan <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
      <a class="cta cta-ghost" href="${waUrl('not')}" target="_blank" rel="noopener">Chat with us on WhatsApp</a>
    </div>`;
  }

  h+=`<button class="restart-link" onclick="restart()">← Assess another business</button>
    <div class="footer-note"><i class="ti ti-lock" style="font-size:11px" aria-hidden="true"></i>Responses are confidential</div>
  </div>`;
  return h;
}

/* ---------------- live CTAs (email + whatsapp) ---------------- */
function leadBody(kind){
  const L=S.lead,sc=lastDetail.overall;
  const map={eligible:'appears funding-ready',partial:'is developing (partially ready)',not:'is at an early stage'};
  return `Hello AAA team,%0D%0A%0D%0AI completed the SME business-readiness check and my business ${map[kind]||''}.%0D%0A%0D%0ABusiness: ${enc(L.biz)}%0D%0AContact: ${enc(L.name)}%0D%0AEmail: ${enc(L.email)}%0D%0AReadiness score: ${sc}%25%0D%0A%0D%0APlease send me the next steps for AAA SME accreditation.%0D%0A%0D%0AThanks,%0D%0A${enc(L.name)}`;
}
function enc(s){return encodeURIComponent(s||'').replace(/%20/g,' ');}
function mailUrl(kind){
  const subj=encodeURIComponent(`AAA SME Accreditation - ${S.lead.biz||'enquiry'}`);
  return `mailto:${CONTACT.email}?subject=${subj}&body=${leadBody(kind)}`;
}
function waUrl(kind){
  const L=S.lead,sc=lastDetail.overall;
  const txt=encodeURIComponent(`Hi AAA, I completed the SME business-readiness check.\nBusiness: ${L.biz}\nName: ${L.name}\nEmail: ${L.email}\nScore: ${sc}%\nI'd like to know the next steps.`);
  return `https://wa.me/${CONTACT.wa}?text=${txt}`;
}

/* ---------------- result animation ---------------- */
function animateResult(){
  const ring=document.getElementById('gaugeRing');
  if(ring)ring.style.strokeDashoffset=ring.getAttribute('data-target');
  const num=document.getElementById('gaugeNum');
  if(num){const target=+num.getAttribute('data-target');let c=0;const step=Math.max(1,Math.ceil(target/30));
    const iv=setInterval(()=>{c+=step;if(c>=target){c=target;clearInterval(iv);}num.textContent=c+'%';},24);}
  const poly=document.getElementById('radarPoly');
  if(poly){poly.style.opacity='1';poly.style.transform='scale(1)';}
  document.querySelectorAll('.catbar-fill').forEach((el,i)=>{setTimeout(()=>{el.style.width=el.getAttribute('data-w');},80+i*60);});
}

/* ---------------- lead capture to inbox ---------------- */
let _leadSent=false;
function submitLead(outcomeLabel){
  if(_leadSent)return;
  const L=S.lead||{}, d=lastDetail||{cats:{}};
  if(!L.email)return;
  _leadSent=true;
  const payload={
    _subject:`New SME readiness lead: ${L.biz||'(no name)'} (${d.overall||0}%)`,
    _template:'table',
    Business:L.biz||'', Contact:L.name||'', Email:L.email||'',
    'Overall score':(d.overall||0)+'%',
    Outcome:outcomeLabel||'',
    'Financial & Funding':((d.cats&&d.cats.fin)||0)+'%',
    'Operations':((d.cats&&d.cats.ops)||0)+'%',
    'Management & Structure':((d.cats&&d.cats.mgmt)||0)+'%',
    'Governance & Compliance':((d.cats&&d.cats.gov)||0)+'%',
    'Market Presence & Growth':((d.cats&&d.cats.market)||0)+'%',
    'Continuous Improvement':((d.cats&&d.cats.improve)||0)+'%',
    Captured:new Date().toLocaleString()
  };
  // 1) Save as a row in the Google Sheet backend (table storage)
  if(CONTACT.sheet){
    const row={
      Timestamp:new Date().toISOString(),
      Business:L.biz||'', Contact:L.name||'', Email:L.email||'',
      'Overall score':(d.overall||0)+'%',
      Outcome:outcomeLabel||'',
      'Financial & Funding':((d.cats&&d.cats.fin)||0)+'%',
      'Operations':((d.cats&&d.cats.ops)||0)+'%',
      'Management & Structure':((d.cats&&d.cats.mgmt)||0)+'%',
      'Governance & Compliance':((d.cats&&d.cats.gov)||0)+'%',
      'Market Presence & Growth':((d.cats&&d.cats.market)||0)+'%',
      'Continuous Improvement':((d.cats&&d.cats.improve)||0)+'%'
    };
    try{
      fetch(CONTACT.sheet,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)}).catch(()=>{});
    }catch(err){/* silent */}
  }
  // 2) Email notification to the inbox
  try{
    fetch('https://formsubmit.co/ajax/'+encodeURIComponent(CONTACT.collect),{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(payload)
    }).catch(err=>{console.warn('Email notify failed:',err);});
  }catch(err){console.warn('Email notify failed:',err);}
}

function restart(){S={screen:'welcome',sec:0,ans:{},disqMsg:null,lead:{biz:'',name:'',email:''}};lastDetail={overall:0,cats:{}};_leadSent=false;render();}
/* ---------------- PWA: install + service worker ---------------- */
let _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();_deferredPrompt=e;
  const row=document.getElementById('installRow');if(row)row.classList.add('show');
});
window.addEventListener('appinstalled',()=>{
  _deferredPrompt=null;
  const row=document.getElementById('installRow');if(row)row.classList.remove('show');
});
function doInstall(){
  if(_deferredPrompt){_deferredPrompt.prompt();_deferredPrompt.userChoice.finally(()=>{_deferredPrompt=null;const row=document.getElementById('installRow');if(row)row.classList.remove('show');});}
}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
function showIosHintIfNeeded(){
  const ua=window.navigator.userAgent||'';
  const isIos=/iPad|iPhone|iPod/.test(ua)&&!window.MSStream;
  if(isIos&&!isStandalone()){const h=document.getElementById('installHint');if(h)h.classList.add('show');}
}
/* served from the Next.js site — no service worker / manifest to register */

render();
setTimeout(showIosHintIfNeeded,300);
</script>
</body>
</html>
