# Host-level nginx site for the AAA website — matches the existing AAA Hetzner
# box, where nginx :443 already fronts campaigns.aaa-accreditation.org
# (→ 127.0.0.1:3000, the tepa landing pages). This app's container is
# published on 127.0.0.1:3100 (APP_HOST_PORT in docker-compose.prod.yml) so the
# two never collide.
#
# Install (after DNS points here — see docs/DEPLOYMENT.md "DNS cut-over"):
#   certbot certonly --nginx -d aaa-accreditation.org -d www.aaa-accreditation.org
#   ln -s /opt/aaa-web/app/deploy/nginx/aaa-accreditation.org.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Static folders on the host (outside the git checkout):
#   /opt/aaa-web/adcp/                ADCP certificate SPA (QR codes!)
#   /opt/aaa-web/wp-content/uploads/  legacy WordPress files still linked from pages

upstream aaa_web {
    server 127.0.0.1:3100;
    keepalive 16;
}

# HTTP → HTTPS. The redirect sits in a location (not at server level) so the
# exact-match ACME challenge location certbot's nginx authenticator injects at
# renewal time still wins.
server {
    listen 80;
    listen [::]:80;
    server_name aaa-accreditation.org www.aaa-accreditation.org;
    location / {
        return 301 https://aaa-accreditation.org$request_uri;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.aaa-accreditation.org;

    ssl_certificate     /etc/letsencrypt/live/aaa-accreditation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aaa-accreditation.org/privkey.pem;
    include /opt/aaa-web/app/deploy/nginx/ssl-params.conf;

    return 301 https://aaa-accreditation.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aaa-accreditation.org;

    ssl_certificate     /etc/letsencrypt/live/aaa-accreditation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aaa-accreditation.org/privkey.pem;
    include /opt/aaa-web/app/deploy/nginx/ssl-params.conf;

    # Admin uploads are capped at 4 MB in lib/media.ts; leave headroom.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # --- ADCP certificate verification (static React SPA) ----------------
    # Printed QR codes point at /adcp/CertificateDetails/<id>: unknown /adcp/*
    # paths fall back to the SPA's index.html, on this domain, no redirect.
    location = /adcp {
        return 301 /adcp/;
    }
    location ^~ /adcp/ {
        root /opt/aaa-web;                       # → /opt/aaa-web/adcp/...
        try_files $uri $uri/ /adcp/index.html;
        add_header Cache-Control "no-cache";

        location ^~ /adcp/static/ {
            root /opt/aaa-web;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # --- Legacy WordPress uploads (application forms, post images) -------
    # Only the referenced files are copied (deploy/wp-uploads-manifest.sh) —
    # the old site was compromised, never mirror it wholesale. Documents and
    # images only; anything else under /wp-content is a 404.
    location ~* ^/wp-content/uploads/.+\.(pdf|docx?|xlsx?|pptx?|jpe?g|png|gif|webp)$ {
        root /opt/aaa-web;                       # → /opt/aaa-web/wp-content/uploads/...
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff;
    }
    # Plain prefix (not ^~) so the regex location above is still consulted.
    location /wp-content/ {
        return 404;
    }

    # --- Everything else: the Next.js app ---------------------------------
    location / {
        proxy_pass http://aaa_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # proxy.ts gates sme.* on the raw Host header; NextAuth and Server
        # Actions need the original host and scheme.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

