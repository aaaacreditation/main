# TLS settings shared by the server blocks in aaa-accreditation.org.conf.
#
# Kept in the repo instead of including certbot's options-ssl-nginx.conf /
# ssl-dhparams.pem, which only exist on boxes where certbot's nginx *installer*
# has run — `certbot certonly` (what the docs use) does not create them.
# TLS 1.2+ with modern ECDHE suites needs no dhparam file.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:aaa_web_ssl:10m;
ssl_session_tickets off;
